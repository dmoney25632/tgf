# Supabase CLI config. Used by `npx supabase start` (local stack) and as a
# record of the auth settings this app expects. The hosted project's settings
# live in the dashboard; see "Supabase setup" in README.md.
project_id = "tgf"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Confirm your TGF account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your TGF password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new TGF email"
content_path = "./supabase/templates/email_change.html"
